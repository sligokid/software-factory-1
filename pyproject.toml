[project]
name = "software-factory"
version = "0.1.0"
description = "Vertical-slice service built by the AI Software Factory"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/core", "src/market_es", "src/slices"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "N"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["app", "core", "market_es", "slices", "factory"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/slices", "factory"]
pythonpath = ["src", "."]
addopts = "-q"
