# Builds and publishes the runner images on a release tag. Products pull them as
# ghcr.io/<owner>/<repo>/runner-<base|python|node|reviewer>:<version>; make the packages readable
# by the product repositories (package settings -> Manage Actions access).
name: images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}/runner"
          make images IMAGE_PREFIX="$prefix"
          make push IMAGE_PREFIX="$prefix"
