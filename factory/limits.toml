# Size limits enforced by `make check` and CI (FR-21, FR-24).
# Agents may not edit this file (factory/ is protected).

[commit]
# Max changed lines per task commit, excluding the paths below.
max_changed_lines = 300
exclude = ["uv.lock", "*.lock", "specs/**"]

[files]
# Max lines per governed file. Globs are relative to the repo root.
"CLAUDE.md" = 120
".specify/memory/constitution.md" = 250
"src/slices/*/SLICE.md" = 80
